# 保留生产环境的 AnyTrack CSP 扩展，仅增加允许的脚本和采集主机。
map $upstream_http_content_security_policy $linkscope_csp {
    default $upstream_http_content_security_policy;
    ~assets\.anytrack\.io $upstream_http_content_security_policy;
    "~^(?<csp_scripts>.*script-src[^;]*)(?<csp_between>;.*connect-src[^;]*)(?<csp_rest>;.*)$" "$csp_scripts https://assets.anytrack.io$csp_between https://t1.anytrack.io$csp_rest";
}

server {
    listen 80;
    server_name meta.lu81.com;

    # 保留 ACME 校验目录，后续可以在新服务器独立续期证书。
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/meta.lu81.com;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://meta.lu81.com$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name meta.lu81.com;

    # 使用新服务器独立申请的 Let's Encrypt 证书，由 Certbot 定时续期。
    ssl_certificate /etc/letsencrypt/live/meta.lu81.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meta.lu81.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;

    location / {
        # 应用只监听回环地址，避免绕过宝塔 Nginx 直接访问。
        proxy_pass http://127.0.0.1:18080;
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy $linkscope_csp always;
        proxy_set_header Host $host;
        # 覆盖公网传入的同名头，确保应用只信任宝塔 Nginx 提供的客户端地址。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 40s;
    }

    access_log /www/wwwlogs/meta.lu81.com.log;
    error_log /www/wwwlogs/meta.lu81.com.error.log;
}
