# Add only AnyTrack's public loader and collection hosts to the application's
# nonce-bearing CSP; all other landing-page restrictions remain unchanged.
map $upstream_http_content_security_policy $linkscope_csp {
    default $upstream_http_content_security_policy;
    ~assets\.anytrack\.io $upstream_http_content_security_policy;
    "~^(?<csp_scripts>.*script-src[^;]*)(?<csp_between>;.*connect-src[^;]*)(?<csp_rest>;.*)$" "$csp_scripts https://assets.anytrack.io$csp_between https://t1.anytrack.io$csp_rest";
}

# 仅在 Certbot 为 meta.lu81.com 生成下面的证书文件之后启用此配置。
server {
    listen 80;
    server_name meta.lu81.com;
    access_log off;
    # 续期校验保持 HTTP 可访问，其余请求固定跳转到本站 HTTPS。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://meta.lu81.com$request_uri;
    }
}
server {
    listen 443 ssl;
    server_name meta.lu81.com;
    # 使用与新子域名对应的证书目录，保持站点名、跳转地址和证书一致。
    ssl_certificate /etc/letsencrypt/live/meta.lu81.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meta.lu81.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:8080;
        # Replace the upstream CSP with the same nonce policy plus the two AnyTrack hosts.
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy $linkscope_csp always;
        proxy_set_header Host $host;
        # 应用只信任配置的 Docker 网关；公网传入的同名头在此覆盖。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 40s;
    }
}
