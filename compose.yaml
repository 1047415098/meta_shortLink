services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U analytics -d analytics]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: postgres://analytics:${POSTGRES_PASSWORD}@db:5432/analytics?sslmode=disable
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env}
      META_ENCRYPTION_KEYS: ${META_ENCRYPTION_KEYS:-}
      META_ENCRYPTION_KEY_ID: ${META_ENCRYPTION_KEY_ID:-}
      # 小说投放统计使用匿名访客 Cookie 计算独立访客，不承载登录身份。
      COOKIE_MODE: ${COOKIE_MODE:-all}
      REPORT_TIMEZONE: ${REPORT_TIMEZONE:-Asia/Shanghai}
      RETENTION_DAYS: ${RETENTION_DAYS:-90}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      GEOIP_DB_PATH: ${GEOIP_DB_PATH:-}
      AUDIO_NOVEL_DIR: /app/audio-novel
      AUDIO_NOVEL_UPLOAD_DIR: /app/data/audio-novel-uploads
      AUDIO_NOVEL_AUDIO_DIR: /app/data/audio-novel-audio
      NOVEL_DIR: /app/novel-h5
      NOVEL_UPLOAD_DIR: /app/data/novel-uploads
    volumes:
      - ./geoip:/app/geoip:ro
      - audio_novel_uploads:/app/data/audio-novel-uploads
      - audio_novel_audio:/app/data/audio-novel-audio
      - novel_uploads:/app/data/novel-uploads
volumes:
  postgres_data:
  # Audio novel covers remain available when the application container is replaced.
  audio_novel_uploads:
  # Podcast MP3 使用独立持久卷，更新容器不会丢失。
  audio_novel_audio:
  # 免费小说封面使用独立持久卷，不与语音小说内容混用。
  novel_uploads:
